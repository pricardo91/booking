# Textos das respostas de erro. Arquivo em UTF-8.
# Cada chave de dominio corresponde a um CodigoErro; as de "erro." sao usadas pelo handler.

# Titulos das respostas
erro.titulo.regra-de-negocio=Regra de negócio violada
erro.titulo.conflito=Conflito de estado
erro.titulo.nao-encontrado=Recurso não encontrado
erro.titulo.dados-invalidos=Dados inválidos
erro.titulo.conflito-de-dados=Conflito de dados
erro.titulo.erro-interno=Erro interno

# Respostas gerais (nao vem do dominio)
erro.dados-invalidos=Um ou mais campos estão inválidos.
erro.conflito-de-dados=Já existe um registro com os dados informados.
erro.erro-interno=Ocorreu um erro inesperado. Tente novamente mais tarde.
erro.campo-invalido=inválido

# Campos obrigatorios
campo.obrigatorio=O campo {0} é obrigatório.

# Sala
sala.capacidade.invalida=A capacidade deve ser maior que zero.
sala.inativa=Não é possível reservar uma sala inativa.
sala.ja.ativa=A sala já está ativa.
sala.ja.inativa=A sala já está inativa.
sala.nao.encontrada=Sala com ID {0} não foi encontrada.
sala.nome.duplicado=Já existe uma sala com o nome {0}.

# Reserva
reserva.intervalo.invalido=O fim deve ser depois do início.
reserva.ainda.nao.terminou=A reserva ainda não terminou.
reserva.so.pendente.confirma=Só é possível confirmar uma reserva pendente.
reserva.so.ativa.finaliza=Só é possível finalizar uma reserva ativa.
reserva.ja.cancelada=A reserva já foi cancelada.
reserva.finalizada.nao.cancela=Uma reserva finalizada não pode ser cancelada.
reserva.conflito.horario=Já existe uma reserva ativa para esta sala neste horário.
reserva.nao.encontrada=Reserva com ID {0} não foi encontrada.

# Usuario
usuario.nao.encontrado=Usuário com ID {0} não foi encontrado.
